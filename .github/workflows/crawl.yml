name: Update Search Index

on:
  schedule:
    # Runs every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows you to run the crawler manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Crawler
        run: python crawler.py

      - name: Commit and Push if index changed
        run: |
          git config --global user.name "GitHub Action Crawler"
          git config --global user.email "action@github.com"
          git add search_index.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated search index update" && git push)
