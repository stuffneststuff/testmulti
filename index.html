<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independent Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .search-bar { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
        .result-card { border: 1px solid transparent; transition: all 0.2s; }
        .result-card:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-4xl mx-auto px-6 py-16">
        <!-- Brand Header -->
        <header class="text-center mb-12">
            <div class="inline-flex items-center justify-center p-4 bg-sky-600 rounded-3xl shadow-xl shadow-sky-900/20 mb-6">
                <i class="fas fa-spider text-white text-4xl"></i>
            </div>
            <h1 class="text-5xl font-black tracking-tighter mb-2 italic">CRAWL<span class="text-sky-500">SEARCH</span></h1>
            <p class="text-slate-500 font-medium">Independent index • Zero tracking • Custom crawler</p>
        </header>

        <!-- Search Input -->
        <div class="relative max-w-2xl mx-auto mb-10">
            <input 
                type="text" 
                id="search-box" 
                placeholder="Query your personal index..." 
                class="search-bar w-full h-16 pl-14 pr-6 rounded-2xl text-xl focus:outline-none focus:ring-4 focus:ring-sky-500/20 transition-all"
                disabled
            >
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 text-xl"></i>
            <div id="loading-spinner" class="absolute right-5 top-1/2 -translate-y-1/2">
                <i class="fas fa-circle-notch fa-spin text-sky-500"></i>
            </div>
        </div>

        <!-- Status & Results -->
        <div class="flex items-center justify-between px-2 mb-6 text-xs font-bold uppercase tracking-widest text-slate-500">
            <span id="index-stat">Loading Database...</span>
            <span id="sync-stat"></span>
        </div>

        <div id="results-area" class="space-y-6"></div>
    </div>

    <script>
        let database = [];
        const searchBox = document.getElementById('search-box');
        const resultsArea = document.getElementById('results-area');
        const spinner = document.getElementById('loading-spinner');
        const indexStat = document.getElementById('index-stat');
        const syncStat = document.getElementById('sync-stat');

        // Initialize by loading the crawler's output
        async function loadIndex() {
            try {
                const res = await fetch('search_index.json');
                if (!res.ok) throw new Error("Index not yet generated by Action.");
                
                database = await res.json();
                
                searchBox.disabled = false;
                spinner.classList.add('hidden');
                indexStat.innerText = `${database.length} pages indexed`;
                
                if (database.length > 0 && database[0].timestamp) {
                    const lastUpdate = new Date(database[0].timestamp).toLocaleDateString();
                    syncStat.innerText = `Updated: ${lastUpdate}`;
                }
            } catch (err) {
                indexStat.innerHTML = `<span class="text-red-400">Error: Run GitHub Action to build index</span>`;
                console.error(err);
            }
        }

        searchBox.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query.length < 2) {
                resultsArea.innerHTML = '';
                return;
            }

            const matches = database.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.content.toLowerCase().includes(query) ||
                item.url.toLowerCase().includes(query)
            );

            displayResults(matches);
        });

        function displayResults(results) {
            if (results.length === 0) {
                resultsArea.innerHTML = `<div class="text-center text-slate-600 mt-20 italic">No matches in your local index</div>`;
                return;
            }

            resultsArea.innerHTML = results.map(item => `
                <div class="result-card p-6 rounded-2xl bg-slate-900/30">
                    <a href="${item.url}" target="_blank" class="group">
                        <div class="text-sky-500 text-xs font-mono mb-1 truncate">${item.url}</div>
                        <h3 class="text-xl font-bold text-slate-100 group-hover:underline mb-2">${item.title}</h3>
                        <p class="text-slate-400 text-sm leading-relaxed">${item.snippet}</p>
                    </a>
                </div>
            `).join('');
        }

        loadIndex();
    </script>
</body>
</html>
